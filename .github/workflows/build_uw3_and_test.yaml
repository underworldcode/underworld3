name: test_uw3

# Build + test on every PR / push to main / development.
#
# Uses pixi (with the committed pixi.lock) for a deterministic, fast install
# rather than micromamba + environment.yaml, which had been backtracking for
# 60+ minutes on conda-forge solves and timing the runner out before tests
# could start. The pixi.lock matches what local development uses, so CI now
# runs against the same dependency state developers see.
#
# The serial batches run SHARDED across parallel jobs (#730). Wall-clock no
# longer tracks total test time: it tracks the slowest shard. See
# scripts/test.sh for the shard assignment and the measurements behind it.

on:
  push:
    branches:
      - main
      - development
      - Quick_Start_Docs

  pull_request:

  workflow_dispatch:

env:
  # Some Azure runners carry a MANA NIC whose InfiniBand verbs device UCX
  # advertises but cannot open: uct_iface_open(ud_verbs/mana_0) fails inside
  # MPI_Init, so `import underworld3` dies before any UW3 code runs (issues
  # #461/#528 — four hits in the first week of 2026-08, each costing a manual
  # re-roll). A single-node CI runner needs only shared memory and TCP, so pin
  # the UCX transports and retire the whole flake class.
  UCX_TLS: tcp,sm,self

  # Distribute the serial batches across worker processes. This was held back
  # until #567 was fixed: worker counts change which files share a process, and
  # a units test that switched the units system on at import time then reached
  # a module-scoped fixture in the point-locator suite before anything reset it.
  # That is fixed at source in tests/conftest.py, and the whole suite is green
  # at 4, 8 and 16 workers.
  #
  # 4 is the vCPU count of the runner. Do NOT try to detect it: the first
  # attempt derived the count inside the job, got 1, and ran xdist with a single
  # worker — a spawn and a fresh underworld3 import per batch, parallelising
  # nothing, for 52m37s. The MPI batches are unaffected either way; they run
  # their own mpirun.
  WORKERS: 4

jobs:
  # How many shards to run is NOT stated here. scripts/test.sh assigns each
  # batch to a shard by hand, from measurements, and --print-shards reads the
  # count back out of those assignments. The matrix is built from that, so the
  # number has exactly one definition.
  #
  # A second copy would be a silent-coverage bug, not a nuisance: a matrix of
  # [1,2,3] against an assignment using 4 runs green while shard 4's batches —
  # the largest group, 194 files — never run. That is #721, files going dark
  # with nothing to say so.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the shard count out of the batch assignment
        id: shards
        run: |
          list=$(./scripts/test.sh --print-shards)
          echo "shards: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  shards:
    needs: plan
    strategy:
      # Every shard reports. Without this, the first shard to fail cancels the
      # others and the log shows one failure where there may be four — which is
      # the opposite of what a sharded run is for.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    # strategy.job-total is the matrix length, so the shard count is never
    # written down a second time here either.
    name: shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest

    # Per SHARD, not per suite. The unsharded job ran 96 minutes against a
    # 120-minute cap and #689 was cancelled at 2h00m52s with zero failures, so
    # the cap was deciding outcomes. The slowest shard is ~33 min of tests plus
    # ~5 min of install and build; 60 leaves room for a slow runner while still
    # being a real signal when a shard doubles.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install pixi from lockfile
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          # Use the env that matches local development for tests.
          # `dev` = conda-petsc + runtime + dev features (pytest, jupyter, etc.)
          environments: dev
          # Hard-fail if pixi.lock disagrees with pixi.toml — never re-solve
          # silently in CI; that's exactly the failure mode we're escaping.
          frozen: true
          cache: true

      - name: Build UW3
        # `pixi run -e dev build` invokes the build task from pixi.toml,
        # which is `pip install . --no-build-isolation` (non-editable —
        # editable installs are project policy violation, see CLAUDE.md).
        #
        # Each shard pays this (~2.5 min) rather than downloading a shared
        # build artefact. That is deliberate: the shards run concurrently, so
        # the repeated build costs wall-clock ONCE, and the repo is public, so
        # the extra runner minutes are free. Sharing the artefact would add a
        # pack/upload/download round trip and a second definition of what
        # "built" means, to save nothing on the clock.
        run: pixi run -e dev build

      # Import smoke test: a hard crash during `import underworld3` (segfault
      # / abort in a compiled module, e.g. from a poisoned env cache) kills
      # pytest BEFORE its first stdout flush, so every batch below fails with
      # zero output and the run is undiagnosable from the log (this happened
      # on PR #394 — a runner-side flake that cost a full debug round-trip).
      # This 5-second step makes any import-time crash loud and localised:
      # faulthandler prints the native traceback here rather than nothing
      # there.
      - name: Import smoke test (faulthandler)
        run: pixi run -e dev python -u -X faulthandler -c "import faulthandler; faulthandler.enable(); import underworld3; print('import OK', underworld3.__version__)"

      - name: Run tests
        run: pixi run -e dev ./scripts/test.sh --p 2 --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # One check that says whether the suite passed, so a reader (and anything
  # querying statusCheckRollup for "test") gets a single answer rather than
  # having to AND four shard results together. It is named `test` because that
  # is what the check was called before sharding.
  test:
    name: test
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the shard results
        run: |
          echo "shards: ${{ needs.shards.result }}"
          if [ "${{ needs.shards.result }}" != "success" ]; then
            echo "At least one shard did not pass — open the shard jobs above."
            exit 1
          fi

  # The tier C characterisations are a REPORT, not a gate, so they run on a
  # push to development rather than on every pull request. They include the
  # slow level_3 cases and add ~42 min, which a PR should not pay to learn
  # something that cannot block it. Failures here are expected to be read
  # and answered, not reverted.
  #
  # Its own job, not a step on the sharded one: as a step it would run once per
  # shard and cost its ~42 minutes four times over for one report.
  tier-c:
    name: Tier C characterisations (report only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install pixi from lockfile
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: dev
          frozen: true
          cache: true

      - name: Build UW3
        run: pixi run -e dev build

      - name: Tier C characterisations (report only)
        run: pixi run -e dev ./scripts/test.sh --tier-c-report
